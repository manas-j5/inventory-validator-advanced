name: Coverage Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage details
        run: python -m pytest --cov=src --cov-report=term-missing

      - name: Enforce minimum coverage threshold
        run: python -m coverage report --include='src/*' --show-missing --fail-under=85
