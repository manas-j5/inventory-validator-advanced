name: Lint Check

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependency
        run: python -m pip install pycodestyle

      - name: Run pycodestyle
        run: python -m pycodestyle --max-line-length=100 src tests
